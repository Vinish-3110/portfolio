services:
  backend:
    build: ./backend
    env_file: .env
    environment:
      PORT: 5000
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-https://api.vinishpurohit.in}
    expose:
      - "5000"
    ports:
      - "5000:5000"
    volumes:
      - backend_uploads:/app/uploads
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://api.vinishpurohit.in/api}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://vinishpurohit.in}
        NEXT_PUBLIC_ADMIN_URL: ${NEXT_PUBLIC_ADMIN_URL:-https://admin.vinishpurohit.in}
        NEXT_PUBLIC_GA_ID: ${NEXT_PUBLIC_GA_ID:-}
    env_file: .env
    expose:
      - "3000"
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

  proxy:
    image: caddy:2
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - backend
    restart: unless-stopped

volumes:
  backend_uploads:
  caddy_data:
  caddy_config:
