services:
  backend:
    build: ./backend
    environment:
      PORT: 5000
      MONGODB_URI: ${MONGODB_URI:-}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-change-me}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-https://api.vinishpurohit.in}
    expose:
      - "5000"
    labels:
      - traefik.enable=true
      - traefik.http.middlewares.portfolio-api-https.redirectscheme.scheme=https
      - traefik.http.routers.portfolio-api.entryPoints=http
      - traefik.http.routers.portfolio-api.middlewares=portfolio-api-https
      - traefik.http.routers.portfolio-api.rule=Host(`api.vinishpurohit.in`)
      - traefik.http.routers.portfolio-api.service=portfolio-api
      - traefik.http.routers.portfolio-api-secure.entryPoints=https
      - traefik.http.routers.portfolio-api-secure.rule=Host(`api.vinishpurohit.in`)
      - traefik.http.routers.portfolio-api-secure.tls=true
      - traefik.http.routers.portfolio-api-secure.tls.certresolver=letsencrypt
      - traefik.http.routers.portfolio-api-secure.service=portfolio-api
      - traefik.http.services.portfolio-api.loadbalancer.server.port=5000
    volumes:
      - backend_uploads:/app/uploads
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://api.vinishpurohit.in/api}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://vinishpurohit.in}
        NEXT_PUBLIC_GA_ID: ${NEXT_PUBLIC_GA_ID:-}
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://api.vinishpurohit.in/api}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://vinishpurohit.in}
    expose:
      - "3000"
    labels:
      - traefik.enable=true
      - traefik.http.middlewares.portfolio-web-https.redirectscheme.scheme=https
      - traefik.http.routers.portfolio-web.entryPoints=http
      - traefik.http.routers.portfolio-web.middlewares=portfolio-web-https
      - traefik.http.routers.portfolio-web.rule=Host(`vinishpurohit.in`) || Host(`www.vinishpurohit.in`)
      - traefik.http.routers.portfolio-web.service=portfolio-web
      - traefik.http.routers.portfolio-web-secure.entryPoints=https
      - traefik.http.routers.portfolio-web-secure.rule=Host(`vinishpurohit.in`) || Host(`www.vinishpurohit.in`)
      - traefik.http.routers.portfolio-web-secure.tls=true
      - traefik.http.routers.portfolio-web-secure.tls.certresolver=letsencrypt
      - traefik.http.routers.portfolio-web-secure.service=portfolio-web
      - traefik.http.services.portfolio-web.loadbalancer.server.port=3000
    depends_on:
      - backend
    restart: unless-stopped

  # Only for a machine without Coolify. Coolify already owns ports 80 and 443.
  proxy:
    profiles: ["local"]
    image: caddy:2
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - backend
    restart: unless-stopped

volumes:
  backend_uploads:
  caddy_data:
  caddy_config:
